const API='/api';const ROLE_OPTIONS=['Python FullStack','Java FullStack','Data Analytics','Data Science','AI/ML','MERN Stack','Other'];let me=null,view='home',homeData=null,round='aptitude',assessment=null,selectedQ=0,report=null,filterText='',stageFilter='',toastTimer;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){const r=await fetch(API+path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:Array.isArray(d.detail)?d.detail.map(x=>x.msg).join(', '):'Request failed');return d}
function notify(msg){let n=document.createElement('div');n.className='toast';n.textContent=msg;document.body.append(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),3200)}

function loginPage(message=''){return `<div class="login-shell"><section class="brand-side"><div class="brandmark">iNetz <span>Technologies</span></div><div class="brand-copy"><span class="badge" style="background:#ffffff18;color:#dceaff">RECRUITMENT ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â· ASSESSMENT</span><h1>Great teams start with a better conversation.</h1><p>One clear process for candidate assessments, technical interviews and thoughtful hiring decisions.</p></div><div class="brand-note">A secure recruitment workspace ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â· iNetz Technologies</div></section><section class="login-main"><form class="login-card" id="loginForm"><h2>Welcome back</h2><p class="muted">Sign in to your iNetz recruitment workspace.</p><div id="loginError"></div>${message?errBox(message):''}<div class="field"><label>Email address</label><input name="email" type="email" autocomplete="username" required placeholder="you@company.com"></div><div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required placeholder="Enter your password"></div><button class="btn primary wide">Sign in</button><p class="footer-note">Candidate? <a class="link" href="/candidate">Sign in or create an account</a></p></form></section></div>`}
function candidateLoginPage(message=''){let email=esc(new URLSearchParams(location.search).get('email')||'');return loginPage(message).replace('Sign in to your iNetz recruitment workspace.','Candidate portal sign in. Use your registered email and password.').replace('<input name="email" type="email" autocomplete="username" required placeholder="you@company.com">',`<input name="email" type="email" autocomplete="username" required placeholder="you@company.com" value="${email}">`).replace('<p class="footer-note">Candidate? <a class="link" href="/candidate">Sign in or create an account</a></p>','<p class="footer-note">New to iNetz? <a class="link" href="/candidate/register">Create your candidate account</a></p>').replace('','<p class="footer-note">Recruitment staff? <a class="link" href="/admin">Admin sign in</a></p>').replace('','')}
function registerPage(){let token=new URLSearchParams(location.search).get('token');if(!token){location.replace('/');return}document.body.innerHTML=`<div class="login-shell"><section class="brand-side"><div class="brandmark">iNetz <span>Technologies</span></div><div class="brand-copy"><span class="badge" style="background:#ffffff18;color:#dceaff">CANDIDATE INVITATION</span><h1>Your application is ready.</h1><p>Set a password to access the candidate portal using the email address registered by iNetz.</p></div><div class="brand-note">A secure recruitment workspace ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â· iNetz Technologies</div></section><section class="login-main"><form class="login-card" id="registerForm"><h2>Set your password</h2><p class="muted">Use the email address provided by iNetz when signing in.</p><div id="registerError"></div><div class="field"><label>Password ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â· exactly 8 characters</label><input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="8"></div><div class="field"><label>Confirm password</label><input name="confirm_password" type="password" autocomplete="new-password" required minlength="8" maxlength="8"></div><button class="btn primary wide">Activate candidate account</button></form></section></div>`;$('#registerForm').onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(f.password!==f.confirm_password){$('#registerError').innerHTML=errBox('Passwords do not match');return}try{await api('/redeem-invitation',{method:'POST',body:JSON.stringify({token,password:f.password})});location.href='/'}catch(x){$('#registerError').innerHTML=errBox(x.message)}}}
function adminLoginPage(message=''){let html=loginPage(message);return html.replace('Welcome back','Admin portal sign in').replace('Sign in to your iNetz recruitment workspace.','Sign in with your Admin account.').replace('<p class="footer-note">Candidate? <a class="link" href="/candidate">Sign in or create an account</a></p>','<p class="footer-note">Need an Admin account? <a class="link" href="/admin/register">Request Admin access</a></p>').replace('','<p class="footer-note">Admin requests need approval from an existing Admin. The first Admin uses the credentials configured on the server.</p>')}
function adminRequestPage(message=''){document.body.innerHTML=loginPage();let form=document.querySelector('#loginForm');form.id='adminRequestForm';form.innerHTML='<h2>Request Admin access</h2><p class="muted">Create a request for an Admin to review. Access stays disabled until approved.</p><div id="adminRequestError"></div><div class="field"><label>Full name</label><input name="name" required minlength="2"></div><div class="field"><label>Work email</label><input name="email" type="email" required></div><div class="field"><label>Password (10+ characters)</label><input name="password" type="password" required minlength="10"></div><button class="btn primary wide">Submit access request</button><p class="footer-note"><button type="button" class="link" onclick="location.href=\'/admin\'">Back to Admin sign in</button></p>';form.onsubmit=async e=>{e.preventDefault();let values=Object.fromEntries(new FormData(form));try{await api('/admin-request',{method:'POST',body:JSON.stringify(values)});form.innerHTML='<h2>Request submitted</h2><p class="muted">Your Admin access request is waiting for Admin approval.</p><button type="button" class="btn primary" onclick="location.href=\'/admin\'">Back to Admin sign in</button>'}catch(error){document.querySelector('#adminRequestError').innerHTML=errBox(error.message)}}}
const menus=()=>[['home','<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9"/><path d="M9 21v-7h6v7"/></svg>','My overview'],['assessment','<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 4.5h6M9 10h6M9 14h6M9 18h4"/></svg>','Assessments']];
function shell(){let m=menus();return `<div class="layout"><aside class="sidebar" id="sidebar"><div class="side-brand">iNetz <span>Technologies</span></div><div class="side-caption">${greeting()}</div><nav class="nav-list">${m.map(([id,ico,label])=>`<button class="nav-item ${view===id?'active':''}" onclick="navigate('${id}')"><span class="nav-icon">${ico}</span>${label}</button>`).join('')}</nav><div class="side-user"><div class="user-meta"><strong>${esc(me.name)}</strong><small>${esc(me.role.replace('_',' '))}</small></div><button class="btn ghost small" onclick="logout()">Sign out</button></div></aside><main class="main"><header class="topbar"><div class="row"><button class="btn secondary small menu-toggle" aria-label="Open menu" onclick="$('#sidebar').classList.toggle('open')"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><h2>${title()}</h2></div><div class="topbar-right"><span>${esc(new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}))}</span></div></header><section class="content" id="content"><div class="empty">Loading your workspaceÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¦</div></section></main></div>`}

async function boot(){let path=location.pathname.replace(/\/+$/,'')||'/';if(path==='/admin'||path==='/admin/register'){location.replace('/candidate');return}if(path==='/setup-account'){registerPage();return}if(path==='/candidate'||path==='/candidate/login'){try{await api('/logout',{method:'POST'})}catch{}document.body.innerHTML=candidateLoginPage(new URLSearchParams(location.search).has('registered')?'Account created. Sign in with your new credentials.':'');return}if(path==='/admin/register'){adminRequestPage();return}if(path==='/candidate/register'){candidateSignupPage();return}let adminPath=path==='/admin';try{const session=await api('/session');if(!session.authenticated){document.body.innerHTML=adminPath?adminLoginPage():loginPage();return}if(adminPath&&session.role==='candidate'){document.body.innerHTML=adminLoginPage('This is a candidate account. Sign in with an approved Admin account.');return}if(!adminPath&&session.role==='candidate'&&path!=='/candidate/portal'){location.replace('/candidate/portal');return}me=session;document.body.innerHTML=shell();await render()}catch(error){document.body.innerHTML=adminPath?adminLoginPage(error.message):loginPage(error.message)}}async function logout(){await api('/logout',{method:'POST'});me=null;document.body.innerHTML=loginPage()}

async function retakeAssessments(){try{await api('/candidate/retake',{method:'POST'});notify('New assessment attempt is ready');await render()}catch(e){notify(e.message)}}async function startAssessment(r){round=r;try{assessment=await api('/candidate/assessment/'+r);selectedQ=0;view='assessment';await render()}catch(e){notify(e.message)}}
async function renderAssessment(){if(!assessment)assessment=await api('/candidate/assessment/'+round);let completed=assessment.submitted_at,answers=assessment.answers||{},qs=assessment.questions;$('#content').innerHTML=`<div class="page-head"><div><h1>${round==='aptitude'?'Aptitude':'Technical'} assessment</h1><p>${qs.length} questions &middot; one mark per correct answer &middot; no negative marking. ${round==='technical'?'Time limit: 20 minutes.':'Time limit: 30 minutes.'}</p></div>${badge(completed?'Submitted':'In progress')}</div>${completed?`<div class="card"><div class="card-head"><h3>Assessment result</h3>${badge(assessment.score+' / '+qs.length)}</div><div class="detail-grid"><div class="detail-item"><small>Correct</small><strong>${assessment.score}</strong></div><div class="detail-item"><small>Pass benchmark</small><strong>${assessment.pass_mark}/${qs.length}</strong></div></div><p class="muted">Your responses are locked. Your next assessment round remains available regardless of your score.</p><button class="btn primary" onclick="navigate('home')">Return to overview</button></div>`:`<div class="assessment-layout"><div class="card"><div class="row between"><div class="row"><span class="chip">Question ${selectedQ+1} of ${qs.length}</span>${qs[selectedQ].category?`<span class="chip">${esc(qs[selectedQ].category)}</span>`:""}</div><span class="muted">Draft saves automatically</span></div><div class="question"><div class="question-title">${esc(qs[selectedQ].question)}</div><div class="options">${qs[selectedQ].options.map((x,i)=>`<label class="option ${answers[String(selectedQ+1)]===i?'selected':''}"><input type="radio" name="choice" value="${i}" ${answers[String(selectedQ+1)]===i?'checked':''} onchange="setAnswer(${selectedQ},${i})"><span>${String.fromCharCode(65+i)}. ${esc(x)}</span></label>`).join('')}</div></div><div class="row between"><button class="btn secondary assessment-nav-btn" onclick="moveQ(-1)" ${selectedQ===0?'disabled':''}><span aria-hidden="true">&larr;</span> Previous</button><button class="btn secondary assessment-nav-btn" onclick="moveQ(1)" ${selectedQ===qs.length-1?'disabled':''}>Next <span aria-hidden="true">&rarr;</span></button></div></div><aside><div class="card"><div class="card-head"><h3>Question navigator</h3></div><div class="qnav">${qs.map((_,i)=>`<button class="qnum ${answers[String(i+1)]!==undefined?'answered':''} ${i===selectedQ?'current':''}" onclick="selectedQ=${i};renderAssessment()">${i+1}</button>`).join('')}</div><p class="muted" style="font-size:11px;margin-top:14px">${Object.keys(answers).length} answered Â· ${qs.length-Object.keys(answers).length} unanswered</p><button class="btn primary wide" onclick="confirmSubmit()">Review & submit</button></div></aside></div>`}`}
async function setAnswer(i,n){assessment.answers[String(i+1)]=n;renderAssessment();try{await api('/candidate/assessment/'+round,{method:'PUT',body:JSON.stringify({answers:assessment.answers})})}catch(e){notify(e.message)}}
function moveQ(d){selectedQ=Math.max(0,Math.min((assessment?.questions?.length||15)-1,selectedQ+d));renderAssessment()}
async function confirmSubmit(){if(!confirm(`Submit this assessment? ${assessment.questions.length-Object.keys(assessment.answers||{}).length} questions are unanswered. You cannot change answers after submission.`))return;try{let x=await api(`/candidate/assessment/${round}/submit`,{method:'POST'});assessment=await api('/candidate/assessment/'+round);notify(`Submitted ? ${x.score}/${x.max_score}`);await render()}catch(e){notify(e.message)}}
document.addEventListener('submit',async e=>{if(e.target.id==='configForm'){e.preventDefault();try{let config=await api('/admin/config'),form=new FormData(e.target);config.pass_marks=Object.fromEntries(['aptitude','technical'].map(key=>[key,Number(form.get(key))]));await api('/admin/config',{method:'PUT',body:JSON.stringify(config)});notify('Assessment settings saved')}catch(error){notify(error.message)}return}if(e.target.id==='loginForm'){e.preventDefault();let adminPath=location.pathname==='/admin',candidatePath=location.pathname==='/candidate';try{me=await api('/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if((adminPath&&me.role==='candidate')||(candidatePath&&me.role!=='candidate')){await api('/logout',{method:'POST'});document.body.innerHTML=adminPath?adminLoginPage('Candidate accounts cannot sign in to the Admin portal.'):candidateLoginPage('Sign in with a candidate account.');return}document.body.innerHTML=shell();view='home';render()}catch(x){let node=document.querySelector('#loginError');if(node)node.innerHTML=errBox(x.message);else document.body.innerHTML=adminPath?adminLoginPage(x.message):candidatePath?candidateLoginPage(x.message):loginPage(x.message)}}});
window.addEventListener('DOMContentLoaded', boot);
</script><script src="/assets/candidate_signup.js?v=4"></script><script src="/assets/candidate_portal.js?v=2"></script><script src="/assets/focused.js?v=2"></script></body></html>
