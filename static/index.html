const API='/api';const ROLE_OPTIONS=['Python FullStack','Java FullStack','Data Analytics','Data Science','AI/ML','MERN Stack','Other'];let me=null,view='home',homeData=null,round='aptitude',assessment=null,selectedQ=0,codeQ=1,codeLang='python',codeData=null,report=null,filterText='',stageFilter='',toastTimer;

function candidateSignupPage(message=''){let roles=ROLE_OPTIONS.filter(x=>x!=='Other');document.body.innerHTML=`<div class="login-shell"><section class="brand-side"><div class="brandmark">iNetz <span>Technologies</span></div><div class="brand-copy"><span class="badge" style="background:#ffffff18;color:#dceaff">CANDIDATE REGISTRATION</span><h1>Start your application.</h1><p>Create your candidate account to access assessments and track your application.</p></div><div class="brand-note">A secure recruitment workspace Ã‚Â· iNetz Technologies</div></section><section class="login-main"><form class="login-card" id="candidateSignupForm"><h2>Create candidate account</h2><p class="muted">Register yourself to continue to the candidate portal.</p><div id="signupError">${message?errBox(message):''}</div><div class="field"><label>Full name</label><input name="name" required minlength="2" maxlength="160" autocomplete="name"></div><div class="field"><label>Email address</label><input name="email" type="email" required autocomplete="email"></div><div class="field"><label>Phone number <span aria-hidden="true">*</span></label><input name="mobile" type="tel" required minlength="7" maxlength="24" pattern="[+0-9 \\(\\)\\x2d]{7,24}" title="Enter a phone number with 7 to 15 digits" placeholder="e.g. +91 9876543210" autocomplete="tel" inputmode="tel"></div><div class="field"><label>Applied role</label><select name="role">${roles.map(x=>`<option>${esc(x)}</option>`).join('')}<option value="Other">Other</option></select><input name="custom_role" placeholder="Enter the applied role" maxlength="100" style="display:none;margin-top:8px"></div><div class="field"><label>Password Ã‚Â· exactly 8 characters</label><input name="password" type="password" required minlength="8" maxlength="8" autocomplete="new-password"></div><button class="btn primary wide">Create account</button><p class="footer-note">Already registered? <a class="link" href="/candidate">Sign in</a></p><p class="footer-note"><a class="l function registerPage(){let token=new URLSearchParams(location.search).get('token');if(!token){location.replace('/');return}document.body.innerHTML=`<div class="login-shell"><section class="brand-side"><div class="brandmark">iNetz <span>Technologies</span></div><div class="brand-copy"><span class="badge" style="background:#ffffff18;color:#dceaff">CANDIDATE INVITATION</span><h1>Your application is ready.</h1><p>Set a password to access the candidate portal using the email address registered by iNetz.</p></div><div class="brand-note">A secure recruitment workspace Ã‚Â· iNetz Technologies</div></section><section class="login-main"><form class="login-card" id="registerForm"><h2>Set your password</h2><p class="muted">Use the email address provided by iNetz when signing in.</p><div id="registerError"></div><div class="field"><label>Password Ã‚Â· exactly 8 characters</label><input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="8"></div><div class="field"><label>Confirm password</label><input name="confirm_password" type="password" autocomplete="new-password" required minlength="8" maxlength="8"></div><button class="btn primary wide">Activate candidate account</button></form></section></div>`;$('#registerForm').onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(f.password!==f.confirm_password){$('#registerError').innerHTML=errBox('Passwords do not match');return}try{await api('/redeem-invitation',{method:'POST',body:JSON.stringify({token,password:f.password})});location.href='/'}catch(x){$('#registerError').innerHTML=errBox(x.message)}}}
function adminLoginPage(message=''){let html=loginPage(message);return html.replace('Welcome back','Admin portal sign in').replace('Sign in to your iNetz recruitment workspace.','Sign in with your Admin account.').replace('<p class="footer-note">Candidate? <a class="link" href="/candidate">Sign in or create an account</a></p>','<p class="footer-note">Need an Admin account? <a class="link" href="/admin/register">Request Admin access</a></p>').replace('','<p class="footer-note">Admin requests need approval from an existing Admin. The first Admin uses the credentials configured on the server.</p>')}
function adminRequestPage(message=''){document.body.innerHTML=loginPage();let form=document.querySelector('#loginForm');form.id='adminRequestForm';form.innerHTML='<h2>Request Admin access</h2><p class="muted">Create a request for an Admin to review. Access stays disabled until approved.</p><div id="adminRequestError"></div><div class="field"><label>Full name</label><input name="name" required minlength="2"></div><div class="field"><label>Work email</label><input name="email" type="email" required></div><div class="field"><label>Password (10+ characters)</label><input name="password" type="password" required minlength="10"></div><button class="btn primary wide">Submit access request</button><p class="footer-note"><button type="button" class="link" onclick="location.href=\'/admin\'">Back to Admin sign in</button></p>';form.onsubmit=async e=>{e.preventDefault();let values=Object.fromEntries(new FormData(form));try{await api('/admin-request',{method:'POST',body:JSON.stringify(values)});form.innerHTML='<h2>Request submitted</h2><p class="muted">Your Admin access request is waiting for Admin approval.</p><button type="button" class="btn primary" onclick="location.href=\'/admin\'">Back to Admin sign in</button>'}catch(error){document.querySelector('#adminRequestError').innerHTML=errBox(error.message)}}}
const menus=()=>[['home','<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9"/><path d="M9 21v-7h6v7"/></svg>','My overview'],['assessment','<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 4.5h6M9 10h6M9 14h6M9 18h4"/></svg>','Assessments']];
function shell(){let m=menus();return `<div class="layout"><aside class="sidebar" id="sidebar"><div class="side-brand">iNetz <span>Technologies</span></div><div class="side-caption">${greeting()}</div><nav class="nav-list">${m.map(([id,ico,label])=>`<button class="nav-item ${view===id?'active':''}" onclick="navigate('${id}')"><span class="nav-icon">${ico}</span>${label}</button>`).join('')}</nav><div class="side-user"><div class="user-meta"><strong>${esc(me.name)}</strong><small>${esc(me.role.replace('_',' '))}</small></div><button class="btn ghost small" onclick="logout()">Ã¢â€ Âª</button></div></aside><main class="main"><header class="topbar"><div class="row"><button class="btn secondary small menu-toggle" onclick="$('#sidebar').classList.toggle('open')">Ã¢ËœÂ°</button><h2>${title()}</h2></div><div class="topbar-right"><span>${esc(new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}))}</span></div></header><section class="content" id="content"><div class="empty">Loading your workspaceÃ¢â‚¬Â¦</div></section></main></div>`}
function navigate(v){if(me?.role==='candidate'&&v==='coding')return;view=v;report=null;render()}
async function boot(){let path=location.pathname.replace(/\/+$/,'')||'/';if(path==='/admin'||path==='/admin/register'){location.replace('/candidate');return}if(path==='/setup-account'){registerPage();return}if(path==='/candidate'||path==='/candidate/login'){try{await api('/logout',{method:'POST'})}catch{}document.body.innerHTML=candidateLoginPage(new URLSearchParams(location.search).has('registered')?'Account created. Sign in with your new credentials.':'');return}if(path==='/admin/register'){adminRequestPage();return}if(path==='/candidate/register'){candidateSignupPage();return}let adminPath=path==='/admin';try{const session=await api('/session');if(!session.authenticated){document.body.innerHTML=adminPath?adminLoginPage():loginPage();return}if(adminPath&&session.role==='candidate'){document.body.innerHTML=adminLoginPage('This is a candidate account. Sign in with an approved Admin account.');return}if(!adminPath&&session.role==='candidate'){location.replace('/candidate/portal');return}me=session;document.body.innerHTML=shell();await render()}catch(error){document.body.innerHTML=adminPath?adminLoginPage(error.message):loginPage(error.message)}}async function logout(){await api('/logout',{method:'POST'});me=null;document.body.innerHTML=loginPage()}
async function render(){let root=$('#content');if(!root)return;root.innerHTML='<div class="empty">LoadingÃ¢â‚¬Â¦</div>';try{homeData=await api(me.role==='candidate'?'/candidate/home':'/portal/dashboard');if(view==='home')root.innerHTML=me.role==='candidate'?candidateOverview():adminOverview();else if(view==='assessment'){if(me.role==='candidate' && (homeData.active_stage==='aptitude'||homeData.active_stage==='technical')){if(round!==homeData.active_stage){round=homeData.active_stage;assessment=null;selectedQ=0;}}await renderAssessment();}else if(view==='coding')await renderCoding();else if(view==='candidates')root.innerHTML=await candidateList();else if(view==='interviews')root.innerHTML=await interviewList();else if(view==='reports')root.innerHTML=reports();else if(view==='staff')root.innerHTML=await staffPage();else if(view==='settings')root.innerHTML=await settingsPage();else if(view==='audit')root.innerHTML=await auditPage();else if(view==='assessments')root.innerHTML=assessmentManagement();}catch(e){root.innerHTML=errBox(e.message)}}
function candidateOverview(){let c=homeData.candidate,stage=homeData.active_stage,attempts=homeData.attempts||[];let attemptFor=name=>attempts.find(a=>a.round===name);let mcqCard=(key,label)=>{let a=attemptFor(key),session=homeData.assessment_sessions?.[key],isActive=stage===key&&!a?.submitted_at,status=a?.submitted_at?'Completed':isActive?(session?.started?'In progress':'Ready to start'):'Not started',score=a?.score;return `<article class="round-card ${isActive?'round-active':''}"><div class="round-top"><span class="round-number">${key==='aptitude'?'01':'02'}</span>${badge(status)}</div><h3>${label}</h3><p>${key==='technical'?'20 questions &middot; 20 minutes':'15 questions &middot; 30 minutes'}</p><div class="round-meta">${score!==null&&score!==undefined?`Score <strong>${score}/${key==='technical'?20:15}</strong>`:`<span>${a?Object.keys(a.answers||{}).length:0} answers saved</span>`}</div>${isActive?`<button class="btn primary small" onclick="startAssessment('${key}')">${session?.started?'Resume round':'Start round'}</button>`:a?.submitted_at?'<span class="muted round-done">Round submitted</span>':'<span class="muted round-done">Available after previous round</span>'}</article>`};let doneCount=['aptitude','technical'].filter(key=>attemptFor(key)?.submitted_at).length,currentLabel=doneCount===2?(stage==='interview'?'Awaiting HR review':'Assessment completed'):({aptitude:'Aptitude',technical:'Technical MCQ'})[stage]||'Awaiting HR review';return `<div class="page-head"><div><h1>Welcome, ${esc(c.name.split(' ')[0])}</h1><p>Track your Aptitude and Technical MCQ assessments.</p></div>${badge(currentLabel)}</div><div class="grid stats"><div class="stat"><div class="stat-label">Current stage</div><div class="stat-value" style="font-size:19px">${esc(currentLabel)}</div><div class="stat-note">Your next step</div></div><div class="stat"><div class="stat-label">Rounds completed</div><div class="stat-value">${doneCount}<span style="font-size:15px;color:var(--muted)"> / 2</span></div><div class="stat-note">Aptitude and Technical MCQ</div></div><div class="stat"><div class="stat-label">MCQ score</div><div class="stat-value">${attempts.reduce((n,a)=>n+(a.score||0),0)}<span style="font-size:15px;color:var(--muted)"> / 35</span></div><div class="stat-note">Aptitude and Technical</div></div><div class="stat"><div class="stat-label">Applied role</div><div class="stat-value" style="font-size:17px">${esc(c.role)}</div><div class="stat-note">Personalized assessment track</div></div></div><div class="card journey-card"><div class="card-head"><div><h3>Your assessments</h3><p class="muted" style="margin:5px 0 0">Complete both assessments in order.</p></div><span class="badge blue">${doneCount} of 2 completed</span></div><div class="progress"><span style="width:${doneCount/2*100}%"></span></div><div class="round-grid">${mcqCard('aptitude','Aptitude')}${mcqCard('technical','Technical MCQ')}</div></div><div class="card"><div class="card-head"><h3>Assessment information</h3></div><p class="muted">Aptitude has 15 questions and a 30-minute limit. Technical MCQ has 20 questions and a 20-minute limit. Your answers save as you work. If time runs out, saved answers are submitted and scored. Assessment scores support review and do not automatically remove you from consideration.</p></div>`}function adminOverview(){let d=homeData.counts,c=homeData.candidates;return `<div class="page-head"><div><h1>Good ${new Date().getHours()<12?'morning':new Date().getHours()<17?'afternoon':'evening'}, ${esc(me.name.split(' ')[0])}</h1><p>Recruitment operations at a glance.</p></div><button class="btn primary" onclick="openCandidateForm()">Ã¯Â¼â€¹ Create candidate</button></div><div class="grid stats"><div class="stat"><div class="stat-label">Total candidates</div><div class="stat-value">${d.total}</div><div class="stat-note">Across the recruitment pipeline</div></div><div class="stat"><div class="stat-label">Coding answers awaiting review</div><div class="stat-value">${d.coding_jobs['Awaiting review']||0}</div><div class="stat-note">Open a candidate report to score submitted code</div></div><div class="stat"><div class="stat-label">Awaiting communication</div><div class="stat-value">${d.awaiting_communication}</div><div class="stat-note">Decisions ready for candidate update</div></div><div class="stat"><div class="stat-label">Awaiting Technical HR</div><div class="stat-value">${d.stages['Technical HR']||0}</div><div class="stat-note">Coding evidence submitted</div></div></div><div class="split"><div class="card"><div class="card-head"><h3>Recent candidates</h3><button class="link" onclick="navigate('candidates')">View all Ã¢â€ â€™</button></div>${c.length?`<div class="table-wrap"><table><thead><tr><th>Candidate</th><th>Role</th><th>Stage</th><th>Decision</th></tr></thead><tbody>${c.slice(0,7).map(x=>`<tr><td><button class="link" onclick="openReport(${x.id})">${esc(x.name)}</button><div class="muted" style="font-size:10px;margin-top:3px">${esc(x.email)}</div></td><td>${esc(x.role)}</td><td>${badge(x.stage)}</td><td>${esc(x.final_decision)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>No candidates yet</strong>Candidate registrations will appear here.</div>`}</div><div class="card"><div class="card-head"><h3>Pipeline stages</h3></div><div class="stage-list">${Object.entries(d.stages).map(([s,n])=>`<div class="stage-row"><span style="width:105px">${esc(s)}</span><div class="progress"><span style="width:${d.total?Math.max(4,n/d.total*100):0}%"></span></div><strong>${n}</strong></div>`).join('')}</div></div></div><div class="card"><div class="card-head"><h3>Coding review queue</h3><span class="muted">Submitted answers for Admin scoring</span></div>${homeData.coding.length?`<div class="table-wrap"><table><thead><tr><th>Candidate ID</th><th>Question</th><th>Status</th><th>Score</th><th>Action</th></tr></thead><tbody>${homeData.coding.map(x=>`<tr><td><button class="link" onclick="openReport(${x.candidate_id})">#${x.candidate_id}</button></td><td>Question ${x.question_id}</td><td>${badge(x.status)}</td><td>${x.score===null?'Pending':x.score+' / '+x.max_score}</td><td><button class="btn secondary small" onclick="openReport(${x.candidate_id})">Review</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No coding submissions yet.</div>`}</div>`}
function assessmentManagement(){return `<div class="page-head"><div><h1>Assessment management</h1><p>Versioned question sets are snapshotted when candidates begin an attempt.</p></div></div><div class="grid stats"><div class="stat"><div class="stat-label">Aptitude question set</div><div class="stat-value">15</div><div class="stat-note">MCQ Ã‚Â· 1 mark each Ã‚Â· pass ${homeData.counts.total?'configurable':'default 8'}</div></div><div class="stat"><div class="stat-label">Technical question set</div><div class="stat-value">20</div><div class="stat-note">Role-aligned technical concepts Ã‚Â· 1 mark each</div></div><div class="stat"><div class="stat-label">Coding question set</div><div class="stat-value">3</div><div class="stat-note">Intermediate 20 Ã‚Â· Advanced 40 + 40</div></div><div class="stat"><div class="stat-label">Coding scoring</div><div class="stat-value" style="font-size:18px">Admin review</div><div class="stat-note">Isolated code execution Ã‚Â· network disabled</div></div></div><div class="card"><div class="card-head"><h3>Assigned assessment set Ã‚Â· v1</h3>${badge('Active')}</div><p class="muted">The currently assigned set contains the required assessment format. MCQ answer keys remain server-side. Coding is scored by authorized Admins. Attempt snapshots preserve question and scoring versions.</p><div class="detail-grid"><div class="detail-item"><small>Aptitude</small><strong>15 questions Ã‚Â· 15 marks</strong></div><div class="detail-item"><small>Technical</small><strong>20 questions &middot; 20 marks</strong></div><div class="detail-item"><small>Coding</small><strong>20 + 40 + 40 marks</strong></div></div><p style="margin:16px 0 0"><button class="btn secondary" onclick="navigate('settings')">Edit pass benchmarks in Settings</button></p></div>`}
async function candidateList(){let arr=homeData.candidates.filter(x=>(!filterText||[x.name,x.email,x.role].join(' ').toLowerCase().includes(filterText.toLowerCase()))&&(!stageFilter||x.stage===stageFilter));return `<div class="page-head"><div><h1>Candidates</h1><p>${homeData.candidates.length} candidate${homeData.candidates.length===1?'':'s'} in the recruitment pipeline.</p></div><button class="btn primary" onclick="openCandidateForm()">Ã¯Â¼â€¹ Create candidate</button></div><div class="card"><div class="filter-row"><input placeholder="Search name, email or role" value="${esc(filterText)}" oninput="filterText=this.value;render()"><select onchange="stageFilter=this.value;render()"><option value="">All stages</option>${['Aptitude MCQ','Technical MCQ','Coding','Technical HR','General HR','Candidate Communication'].map(x=>`<option ${stageFilter===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn secondary small" onclick="location.href='/api/admin/report.csv'">Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>Candidate</th><th>Applied role</th><th>Stage</th><th>Tech recommendation</th><th>Final result</th><th>Actions</th></tr></thead><tbody>${arr.map(x=>`<tr><td><strong>${esc(x.name)}</strong><div class="muted" style="font-size:10px;margin-top:3px">${esc(x.email)} Ã‚Â· ${esc(x.mobile)}</div></td><td>${esc(x.role)}</td><td>${badge(x.stage)}</td><td>${esc(x.tech_recommendation)}</td><td>${esc(x.final_decision)}</td><td><button class="btn secondary small" onclick="openReport(${x.id})">Review report</button></td></tr>`).join('')}</tbody></table></div>${arr.length?'':'<div class="empty">No candidates match these filters.</div>'}</div>`}
async function openReport(id){try{report=await api('/admin/candidates/'+id);showReport()}catch(e){notify(e.message)}}
function showReport(){let c=report.candidate;let h=report.interview||{};let html=`<div class="modal-back" onclick="if(event.target===this){this.remove();report=null}"><div class="modal"><div class="modal-head"><div><h2>${esc(c.name)} Ã‚Â· Candidate report</h2><div class="muted" style="margin-top:5px">${esc(c.role)} Ã‚Â· #${c.id}</div></div><button class="btn secondary small" onclick="document.querySelector('.modal-back').remove()">Close</button></div><div class="detail-grid"><div class="detail-item"><small>Stage</small><strong>${esc(c.stage)}</strong></div><div class="detail-item"><small>Recommendation</small><strong>${esc(c.tech_recommendation)}</strong></div><div class="detail-item"><small>Final decision</small><strong>${esc(c.final_decision)}</strong></div></div><h3 style="font:700 14px Manrope;margin-top:22px">Assessment rounds</h3>${report.attempts.map(a=>`<div class="question"><div class="row between"><strong>${esc(a.round)} &middot; ${a.score}/${a.max_score}</strong>${badge('Submitted')}</div><p class="muted">Pass benchmark ${a.pass_mark}/${a.max_score} Ã‚Â· ${esc(a.submitted_at||'')}</p><div class="field"><label>Internal remarks</label><textarea id="remarks-${a.round}">${esc(a.remarks)}</textarea><button class="btn secondary small" onclick="saveRemarks(${c.id},'${a.round}')">Save remarks</button></div></div>`).join('')||'<div class="empty">No MCQ submissions yet.</div>'}<h3 style="font:700 14px Manrope">Coding submissions</h3>${report.coding.map(x=>`<div class="question"><div class="row between"><strong>Question ${x.question_id} Ã‚Â· ${x.score??'Ã¢â‚¬â€'} / ${x.max_score}</strong>${badge(x.status)}</div><p class="muted">${esc(x.language)} Ã‚Â· ${esc(JSON.stringify(x.result))}</p>${x.source?`<details><summary>View submitted code</summary><pre style="white-space:pre-wrap;background:#111e30;color:#d7e5f9;padding:12px;border-radius:8px;overflow:auto">${esc(x.source)}</pre></details>`:''}</div>`).join('')||'<div class="empty">No coding submissions.</div>'}<h3 style="font:700 14px Manrope">Technical HR interview</h3>${h.recommendation?`<div class="card" style="padding:14px"><div class="detail-grid"><div class="detail-item"><small>Interviewer / date</small><strong>${esc(h.interviewer)} Ã‚Â· ${esc(h.interview_date)}</strong></div><div class="detail-item"><small>Recommendation</small><strong>${esc(h.recommendation)}</strong></div><div class="detail-item"><small>Strengths / skill gaps</small><strong>${esc(h.strengths)} / ${esc(h.gaps)}</strong></div></div><p>${esc(h.remarks)}</p><p class="muted">Questions: ${esc(h.questions)}<br>Responses: ${esc(h.responses)}<br>Communication: ${esc(h.communication)}<br>Next steps: ${esc(h.next_steps)}</p></div>`:'<p class="muted">Interview not submitted.</p>'}${me.role==='admin'?`<button class="btn primary" onclick="document.querySelector('.modal-back').remove();openInterview(${c.id},${JSON.stringify(h).replace(/"/g,'&quot;')})">${h.recommendation?'Edit':'Record'} technical interview</button>`:''}${me.role==='admin'?`<div class="card" style="padding:15px;margin-top:17px"><h3 style="font:700 14px Manrope">General HR decision</h3><div class="row"><select id="decisionSel">${['Selected','Reinterview','Training recommended','Not selected'].map(v=>`<option ${c.final_decision===v?'selected':''}>${v}</option>`).join('')}</select><select id="channel"><option value="">Prepare result only</option><option>Email</option><option>WhatsApp</option><option>Phone</option><option>In person</option></select></div><div class="field" style="margin-top:10px"><label>Internal HR remarks / next steps</label><textarea id="hrremarks"></textarea></div><div class="field"><label>Feedback released to candidate</label><textarea id="releaseFeedback">${esc(c.release_feedback)}</textarea></div><button class="btn primary" onclick="saveDecision(${c.id})">Save decision and communication</button></div>`:''}<h3 style="font:700 14px Manrope">Activity</h3><div class="timeline">${report.history.map(x=>`<div class="timeline-item"><strong>${esc(x.action)}</strong><div class="muted">${esc(new Date(x.at).toLocaleString())}</div></div>`).join('')||'<span class="muted">No recorded activity</span>'}</div></div></div>`;document.body.insertAdjacentHTML('beforeend',html)}

let selectedExcelCell=null;function selectExcelCell(input){selectedExcelCell=input;$('#excelCellName').textContent=input.dataset.cell;$('#excelFormula').value=input.value}function excelEdit(input){selectExcelCell(input);recalculateExcel()}function applyExcelFormula(){if(!selectedExcelCell)return;selectedExcelCell.value=$('#excelFormula').value;recalculateExcel();selectedExcelCell.focus()}function recalculateExcel(){let today=new Date();today.setHours(0,0,0,0);document.querySelectorAll('.excel-result').forEach(cell=>{let row=Number(cell.dataset.result.slice(1)),dateValue=document.querySelector(`[data-cell="B${row}"]`)?.value,status=document.querySelector(`[data-cell="C${row}"]`)?.value||'',formula=document.querySelector(`[data-cell="D${row}"]`)?.value||'';let due=dateValue?new Date(dateValue+'T00:00:00'):null;let valid=/^=IF\(AND\(B\d+<TODAY\(\),C\d+<>"Done"\),"Overdue","On track"\)$/i.test(formula.replace(/\s/g,''));cell.textContent=valid&&due&&due<today&&status.toLowerCase()!=='done'?'Overdue':valid?'On track':'#NAME?';cell.classList.toggle('excel-overdue',cell.textContent==='Overdue');cell.classList.toggle('excel-error',cell.textContent==='#NAME?')});let msg=$('#excelMessage');if(msg)msg.textContent='Recalculated ' + document.querySelectorAll('.excel-result').length + ' formulas.'}function resetExcel(){renderExcelLab()}

>${esc(data.title)}</h3><p>${esc(data.detail)}</p>${activeSkill==='stats'?`<div class="field"><label>Your answer (mean, median, variance)</label><input id="dataAnswer" placeholder="For example: 5, 4, 6.8"><button class="btn primary small" style="margin-top:8px" onclick="checkDataAnswer()">Check answer</button></div><div class="practice-note">${esc(data.hint)}</div><div id="dataFeedback" class="run-output">Enter your answer to check it.</div>`:activeSkill==='ml'?`<div class="options">${[['A','Precision'],['B','Recall'],['C','Mean squared error']].map(([k,v])=>`<label class="option"><input type="radio" name="mlanswer" value="${k}"><span>${k}. ${v}</span></label>`).join('')}</div><button class="btn primary small" onclick="checkMLAnswer()">Check answer</button><div class="practice-note" style="margin-top:12px">${esc(data.hint)}</div><div id="dataFeedback" class="run-output">Choose an answer to check it.</div>`:`<div class="practice-note">${esc(data.hint)}</div><pre class="codebox" style="white-space:pre-wrap;min-height:160px">${esc(data.code)}</pre><button class="btn primary small" onclick="runDataPython()">â–¶ Run example</button><div id="dataFeedback" class="run-output">Click Run to see the example output.</div>`}</div>`}
function checkDataAnswer(){let input=$('#dataAnswer').value.replace(/\s/g,'');let ok=/^5(?:\.0+)?,4,6(?:\.8+)?$/i.test(input);$('#dataFeedback').textContent=ok?'Correct. Mean = 5, median = 4, population variance = 6.8.':'Not quite. Sorted values are 2, 4, 4, 6, 9. Try again.';$('#dataFeedback').classList.toggle('error',!ok)}function checkMLAnswer(){let answer=document.querySelector('input[name="mlanswer"]:checked')?.value;let ok=answer==='A';$('#dataFeedback').textContent=ok?'Correct. Precision tells us what fraction of fraud alerts were actually fraud.':'Try again. The question asks how often a positive fraud alert is correct.';$('#dataFeedback').classList.toggle('error',!ok)}function runDataPython(){let out=$('#dataFeedback');out.textContent='[11.0, 27.5, 44.0]\n\nExample output preview. Python runtime is not installed in this browser.'}function renderLab(){if(activeSkill==='excel'){renderExcelLab();return}let lab=LABS[activeSkill];if(!practiceCode)practiceCode=lab.code;let editable=['html','react','node'].includes(activeSkill);$('#codeInner').innerHTML=`<div class="page-head"><div><h1>${currentSkills().find(x=>x.id===activeSkill).name} practice lab</h1><p>${esc(lab.title)}</p></div><span class="badge blue">Guided practice</span></div><div class="lab-panel"><div class="card"><div class="card-head"><h3>Challenge</h3><span class="badge">Try it live</span></div><p class="lab-description">${esc(lab.detail)}</p><div class="practice-note">${esc(lab.hint)}</div><div class="test-list"><div class="test-row"><span>Read the example</span><strong>01</strong></div><div class="test-row"><span>Edit and run</span><strong>02</strong></div><div class="test-row"><span>Inspect the output</span><strong>03</strong></div></div><p class="footer-note">Runs locally in your browser sandbox. These practice results are not assessment scores.</p></div><div class="card"><div class="editor-toolbar"><h3 style="margin:0;font:700 15px Manrope">${editable?'Your code':'Example solution'}</h3><div class="row"><button class="btn secondary small" onclick="resetLab()">Reset</button><button class="btn primary small" onclick="runLab()">â–¶ Run</button></div></div><textarea id="labCode" class="codebox lab-editor" spellcheck="false" ${editable?'':'readonly'}>${esc(practiceCode)}</textarea>${activeSkill==='html'?'<iframe title="Live HTML and CSS preview" class="editor-preview" sandbox=""></iframe>':''}<div id="labOutput" class="run-output" aria-live="polite">Click Run to see output here.</div></div></div>`;if(activeSkill==='html'){let editor=$('#labCode'),frame=$('.editor-preview');editor.oninput=()=>{practiceCode=editor.value;frame.srcdoc=practiceCode};frame.srcdoc=practiceCode}}
function runLab(){let editor=$('#labCode'),out=$('#labOutput');if(!editor||!out)return;practiceCode=editor.value;out.classList.remove('error');try{if(activeSkill==='html'){document.querySelector('.editor-preview').srcdoc=practiceCode;out.textContent='Preview updated successfully.';return}if(activeSkill==='react'){let m=practiceCode.match(/return\s*\(([\s\S]*?)\);/);out.textContent=m?'JSX returned (preview only):\n'+m[1].trim():'React component source loaded. Add a return (...) block to preview its JSX.';return}if(activeSkill==='node'){if(/\b(process\.env|child_process|eval\s*\(|Function\s*\(|import\s*\(|require\s*\()/.test(practiceCode))throw Error('This browser preview blocks Node.js access and dynamic code loading.');let m=practiceCode.match(/res\.end\(JSON\.stringify\((\{[\s\S]*?\})\)\)/),data={status:'ok'};if(m){try{data=JSON.parse(m[1].replace(/([a-zA-Z_$][\w$]*)\s*:/g,'"$1":').replace(/'/g,'"'))}catch{}}out.textContent='GET /api/health â†’ 200 OK\ncontent-type: application/json\n\n'+JSON.stringify(data,null,2)+'\n\nSample response preview; Node.js server is not started.';return}if(activeSkill==='mysql'){out.textContent='Query preview\nâ”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€\nTeam          Employee     Salary\nEngineering   Ada          125000\nDesign        Lin           98000\n\nSample rows only. This UI does not connect to MySQL.';return}if(activeSkill==='powerbi'){out.textContent='DAX measure preview\nâ”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€\nMonthly Revenue     $42,850\nCompleted orders    128\n\nSample output only. Power BI is not running in this browser.';return}if(activeSkill==='excel'){out.textContent='Formula preview\nâ”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€\nDue date     Status        Result\nYesterday    In progress   Overdue\nTomorrow     In progress   On track\nYesterday    Done          On track\n\nSample cells only. Edit the formula to explore the logic.';return}}catch(e){out.classList.add('error');out.textContent='Preview error: '+e.message}}function resetLab(){practiceCode=LABS[activeSkill].code;renderLab()}
async function loadCode(){try{codeData=await api(`/candidate/code/${codeQ}?language=${codeLang}`);let q=codeData.question,plain=q.statement;$('#assessmentEditor').innerHTML=`<div class="code-layout"><div class="card"><div class="row between"><h3 style="font:700 17px Manrope;margin:0">${esc(q.title)}</h3>${badge(q.difficulty+' Â· '+q.marks+' marks')}</div><div class="explain-box"><strong>In simple words</strong><br>${esc(plain)}<br><strong>What to return</strong><br>${q.id===1?'Return the two index positions, starting from 0.':q.id===2?'Return one number: the length of the longest continuous section with no repeated character.':'Return a list of ranges after joining the ones that overlap.'}</div><div class="detail-item" style="margin-top:12px"><small>Input size and helpful guidance</small><strong>${esc(q.constraints)}</strong></div><h4>Example, step by step</h4>${q.examples.map(x=>`<div class="result-box"><strong>Input:</strong> ${esc(x.input)}<br><strong>Output:</strong> ${esc(x.output)}${x.explanation?`<span class="example-explain"><strong>Why?</strong> ${esc(x.explanation)}</span>`:''}</div>`).join('')}<div style="margin-top:14px"><label style="font-weight:700;font-size:12px">Assessment language</label><select onchange="codeLang=this.value;loadCode()" style="display:block;width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;margin-top:6px">${['python','java','javascript'].map(x=>`<option value="${x}" ${x===codeLang?'selected':''}>${x==='javascript'?'JavaScript':x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select></div><p class="code-status">${badge(codeData.status)} ${codeData.score!==null?`<span class="chip">${codeData.score} / ${q.marks}</span>`:''}</p><div class="result-box">${esc(codeData.result.feedback||'Save your solution, then submit it for Admin review.')}</div></div><div class="card"><div class="card-head"><h3>Your solution</h3><span class="muted">Autosave is available</span></div><textarea id="sourceCode" class="codebox" spellcheck="false">${esc(codeData.source)}</textarea><div class="row between" style="margin-top:12px"><button class="btn secondary" onclick="saveCode(false)">Save draft</button><button class="btn primary" onclick="saveCode(true)">Submit for Admin review</button></div><p class="footer-note">Assessment submissions support Python, Java and JavaScript and are saved for authorized Admin review.</p></div></div>`}catch(e){$('#assessmentEditor').innerHTML=errBox(e.message)}}async function saveCode(submit){let source=$('#sourceCode')?.value;if(source===undefined)return;try{await api('/candidate/code',{method:'PUT',body:JSON.stringify({question_id:codeQ,language:codeLang,source})});if(submit){if(!confirm('Submit this solution for Admin review? You cannot edit it after submission.'))return;await api(`/candidate/code/${codeQ}/submit`,{method:'POST'});notify('Solution submitted for Admin review')}else notify('Draft saved');await loadCode()}catch(e){notify(e.message)}}
